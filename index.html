<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F1A">
  <meta name="description" content="Hedge: save a slice of every spend, only when it's safe to. Prototype for UK students.">
  <title>Hedge</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="desk-side" aria-hidden="true">
    <img src="assets/logo-stacked.png" alt="" class="desk-logo">
    <p>Clickable prototype<br>District Tech Challenge · Fintech</p>
    <button type="button" class="desk-reset" id="deskReset" tabindex="-1">Restart demo</button>
  </aside>

  <main class="phone" id="phone">
    <div class="statusbar" aria-hidden="true">
      <span class="sb-time" id="sbTime">9:41</span>
      <span class="sb-icons">
        <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .5 10.6 10.6 0 0 0 .7 3.5L2 4.9a8.6 8.6 0 0 1 6-2.4Zm0 4c1.2 0 2.3.4 3.2 1.2l1.3-1.4A6.6 6.6 0 0 0 8 4.5c-1.7 0-3.3.6-4.5 1.8l1.3 1.4C5.7 6.9 6.8 6.5 8 6.5Zm0 2.2-1.9 2 1.9 2 1.9-2-1.9-2Z"/></svg>
        <svg viewBox="0 0 27 12" width="27" height="12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.6"/><rect x="25" y="4" width="1.6" height="4" rx=".8" opacity=".5"/></svg>
      </span>
    </div>
    <div class="stage" id="stage"></div>
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
    <div class="layer" id="layer"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
